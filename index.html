<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Page</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="favicon.png" type="image/x-icon">
</head>
<body>
    <div class="click-screen" id="click-screen">
        <p>Click Me</p>
    </div>
    <div class="container">
        <div class="profile-card">
            <div class="profile-header">
                <img src="profile-pic.png" alt="Profile Picture" class="profile-pic">
                <h1 class="username-css">ClouD</h1>
                <span class="status-icon"></span>
                <audio id="background-audio" loop>
                    <source src="music.mp3" type="audio/mpeg">
                    Your browser does not support the audio element.
                </audio>
                <div id="discord-presence"></div>
                <div class="social-icons">
                    <a href="https://fakecrime.bio/pray" target="_blank" rel="noopener noreferrer" class="social-icon fakecrime-icon"></a>
                    <a href="https://discord.com/users/543623256842829824" target="_blank" rel="noopener noreferrer" class="social-icon discord-icon"></a>
                </div>
                <div class="notch"></div>
            </div>
        </div>
    </div>

    <!-- Background Video thingy -->
    <video id="background-video" autoplay muted loop>
        <source src="background.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <script src="script.js"></script>
</body>
</html>
